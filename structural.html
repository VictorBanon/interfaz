<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IR Dashboard</title>

  <!-- Plotly -->
  <script src="https://cdn.plot.ly/plotly-3.0.1.min.js"></script>

  <!-- FontAwesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <!-- DataTables CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css"
  />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <h2>IR systematic study</h2>
      <nav>
        <ul> 
          <li>
            <a href="index.html" style="text-decoration: none; color: inherit;">
              <i class="fas fa-chart-line"></i> Introduction
            </a>
          </li>  
          <li style="background-color: #354152;">
            <a href="structural.html" style="text-decoration: none; color: inherit;">
              <i class="fas fa-chart-line"></i> Structural Analysis
            </a>
          </li>
          <div class="explanation-card">
            <h4>Goals</h4>
            <p>Here We explain how this dashboard works.</p>
          </div> 
          <li>
            <a href="kmer.html" style="text-decoration: none; color: inherit;">
              <i class="fas fa-chart-line"></i> Kmer Analysis
            </a>
          </li>
          <li>
            <a href="spatial.html" style="text-decoration: none; color: inherit;">
              <i class="fas fa-chart-line"></i> Spatial Analysis
            </a>
          </li>
          <li>
            <a href="cluster.html" style="text-decoration: none; color: inherit;">
              <i class="fas fa-chart-line"></i> Cluster Analysis
            </a>
          </li> 
        </ul>
        <div class="bottom-card">
          This card is at the bottom of the sidebar
        </div>
      </nav>
    </aside>

    <div class="main">
      <section class="card-grid">
        <!-- First card with tabs and plots -->
      <div class="card" id = "card_1">
        <!-- Tabs and Dropdowns in one row -->
        <div class="tab-controls" style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;">
          <!-- Tabs -->
          <div class="tabs" style="display: flex; gap: 0.5rem;" id ="tabs_top_left">
            <button class="tab-button active" data-tab="all">All</button>
            <button class="tab-button" data-tab="cod">Coding</button>
            <button class="tab-button" data-tab="non">Non Coding</button>
          </div>

          <!-- Dropdowns -->
          <!-- Probably should not be hardcoded! --> 
          <div class="dropdowns" style="display: flex; gap: 1rem;">
            <label>
              Taxon:
              <select id="categoryDropdown">
                <option value="superkingdom">Recent</option>
              </select>
            </label>

            <label>
              Filter:
              <select id="filterDropdown">
                <option value="Bacteria">Recent</option>
              </select>
            </label>

            <label>
              Graph:
              <select id="graphDropdown">
                <option value="acp">ACP</option> 
              </select>
            </label>
          </div>
        </div>

        <!-- One Plot Container -->
        <div class="tab-content" style="display: flex;">
          <div id="plot1" style="width:100%;height:100%;"></div> 
        </div>
      </div>
      <!-- Second card with tabs and plots -->
      <div class="card" id = "card_2">
        <div class="tab-controls" style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;">
          <div class="tabs" id ="tabs_top_right">
            <button class="tab-button" data-tab="ha">HA</button>
            <button class="tab-button" data-tab="hb">HB</button>
            <button class="tab-button active" data-tab="hc">HC</button> 
            <button class="tab-button" data-tab="ha">ACP</button>
            <button class="tab-button" data-tab="hb">Stat(min/max and median values)</button>

          </div>
          <!-- Dropdowns -->
          <!-- Probably should not be hardcoded! --> 
          <div class="dropdowns" style="display: flex; gap: 1rem;">
            <label>
              PCX:
              <select id="PCX">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
              </select>
              PCY:
              <select id="PCY">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
              </select>
            </label> 
          </div>
        </div>
          <!-- One Plot Container -->
          <div class="tab-content" style="display: flex;">
            <div id="plot2_1" style="width:50%;height:100%;"></div> 
            <div id="plot2_2" style="width:50%;height:100%;"></div> 
          </div>  
        </div>

      <!-- Third card with single plot -->
      <div class="card"> 
        <div class="tab-content" style="display: flex;">
          <div id="plot3" style="width:100%;height:100%;"></div>
        </div>
      </div>

      <!-- Fourth card with taxonomy table -->
      <div class="card"> 
        <table id="taxonomy" class="display" style="width:100%">
          <thead>
            <tr class="filters">
              <th></th>
              <th></th>
              <th></th>
              <th></th>
              <th></th>
              <th></th>
              <th></th>
              <th></th>
              <th></th>
            </tr>
            <tr>
              <th>Kingdom</th>
              <th>Phylum</th>
              <th>Class</th>
              <th>Order</th>
              <th>Family</th>
              <th>Genus</th>
              <th>Species</th>
              <th>ID</th>
              <th>ID-replicon</th>
            </tr>
          </thead>

          <tbody>
            <!-- Filled dynamically -->
          </tbody>
        </table>
      </div>
      </section>
    </div>
  </div>
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- DataTables JS -->
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <!-- Include PapaParse -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <!-- Custom JS -->
  <script src="./scripts/structural.js"></script>
</body>
</html>
