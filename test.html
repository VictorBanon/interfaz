<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dendrograma Taxonómico</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
    }
    .node circle {
      fill: steelblue;
      cursor: pointer;
    }
    .node text {
      font-size: 12px;
    }
    .link {
      fill: none;
      stroke: #ccc;
      stroke-width: 1.5px;
    }
  </style>
</head>
<body>
  <h2>Dendrograma Interactivo desde CSV</h2>
  <svg width="1000" height="800"></svg>

  <script>
    const width = 1000;
    const height = 800;

    const svg = d3.select("svg")
      .append("g")
      .attr("transform", "translate(40,40)");

    // Función para construir la jerarquía a partir del CSV plano
    function buildHierarchy(data, levels) {
      const root = { name: "root", children: [] };

      data.forEach(row => {
        let current = root;
        levels.forEach(level => {
          const value = row[level];
          if (!value) return;

          let child = current.children.find(d => d.name === value);
          if (!child) {
            child = { name: value, children: [] };
            current.children.push(child);
          }
          current = child;
        });
      });

      return root;
    }

    // Carga el CSV y crea el dendrograma
    d3.csv("taxonomy.csv").then(data => {
      const levels = Object.keys(data[0]);
      const hierarchyData = buildHierarchy(data, levels);

      // Creamos la raíz real a partir de Animalia, etc.
      const root = d3.hierarchy(hierarchyData.children[0]);
      const treeLayout = d3.tree().size([height - 100, width - 200]);
      treeLayout(root);

      // Dibujamos las líneas (links)
      svg.selectAll(".link")
        .data(root.links())
        .enter()
        .append("path")
        .attr("class", "link")
        .attr("d", d3.linkHorizontal()
          .x(d => d.y)
          .y(d => d.x)
        );

      // Dibujamos los nodos
      const node = svg.selectAll(".node")
        .data(root.descendants())
        .enter()
        .append("g")
        .attr("class", "node")
        .attr("transform", d => `translate(${d.y},${d.x})`);

      node.append("circle")
        .attr("r", 5);

      node.append("text")
        .attr("dy", 3)
        .attr("x", d => d.children ? -10 : 10)
        .style("text-anchor", d => d.children ? "end" : "start")
        .text(d => d.data.name);
    });
  </script>
</body>
</html>
