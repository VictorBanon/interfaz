<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <h2>MiPanel</h2>
      <nav>
        <ul>
          <li><i class="fas fa-chart-line"></i> Dashboard</li>
          <li><i class="fas fa-users"></i> Usuarios</li>
          <li><i class="fas fa-cog"></i> Configuración</li>
          <li><i class="fas fa-sign-out-alt"></i> Salir</li>
        </ul>
      </nav>
    </aside>

    <div class="main">
      <header class="header">
        <h1>Bienvenido</h1>
      </header>

      <section class="card-grid">
        <div class="card">📊 Estadísticas</div>
        <div class="card">👥 Usuarios</div>
        <div class="card">🛠 Configuración</div>
        <div class="card">📦 Inventario</div>
      </section>
    </div>
  </div>
</body>
</html>
