<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dendrograma Taxonómico</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
    }
    .node circle {
      fill: steelblue;
      cursor: pointer;
    }
    .node text {
      font-size: 12px;
      pointer-events: none;
    }
    .link {
      fill: none;
      stroke: #ccc;
      stroke-width: 1.5px;
    }
  </style>
</head>
<body>
  <h2>Dendrograma Interactivo desde CSV</h2>
  <svg width="1000" height="800"></svg>

  <script>
    const width = 1000;
    const height = 800;

    const svg = d3.select("svg")
      .append("g")
      .attr("transform", "translate(40,40)");

    function buildHierarchy(data, levels) {
      const root = { name: "root", children: [] };

      data.forEach(row => {
        let current = root;
        levels.forEach(level => {
          const value = row[level];
          if (!value) return;

          let child = current.children.find(d => d.name === value);
          if (!child) {
            child = { name: value, children: [] };
            current.children.push(child);
          }
          current = child;
        });
      });

      return root;
    }

    d3.csv("./data/taxonomy.csv").then(data => {
      const levels = Object.keys(data[0]).filter(col => col !== "ID-replicon");
      const hierarchyData = buildHierarchy(data, levels);
      const root = d3.hierarchy(hierarchyData.children[0]);

      const treeLayout = d3.tree().size([height - 100, width - 200]);
      treeLayout(root);

      const allNodes = root.descendants();
      const allLinks = root.links();

      // Draw links
      svg.selectAll(".link")
        .data(allLinks)
        .enter()
        .append("path")
        .attr("class", "link")
        .attr("d", d3.linkHorizontal()
          .x(d => d.y)
          .y(d => d.x)
        );

      // Draw nodes
      const node = svg.selectAll(".node")
        .data(allNodes)
        .enter()
        .append("g")
        .attr("class", "node")
        .attr("transform", d => `translate(${d.y},${d.x})`)
        .on("mouseover", handleMouseOver)
        .on("mouseout", handleMouseOut);

      node.append("circle")
        .attr("r", 5);

      node.append("text")
        .attr("dy", "-0.8em")
        .attr("text-anchor", "middle")
        .style("font-size", "8px")
        .style("opacity", 1) // visible by default
        .text(d => d.data.name.length > 20 
          ? d.data.name.slice(0, 20) + "…" 
          : d.data.name);

      // Highlight branch on hover
      function handleMouseOver(event, d) {
        const nodesToShow = new Set();

        // Current node
        nodesToShow.add(d);

        // Ancestors
        let ancestor = d.parent;
        while (ancestor) {
          nodesToShow.add(ancestor);
          ancestor = ancestor.parent;
        }

        // Descendants
        d.descendants().forEach(desc => nodesToShow.add(desc));

        // Fade non-branch labels
        svg.selectAll(".node").select("text")
          .style("opacity", n => nodesToShow.has(n) ? 1 : 0.1);

        // Fade non-branch links
        svg.selectAll(".link")
          .style("stroke-opacity", link =>
            nodesToShow.has(link.source) && nodesToShow.has(link.target) ? 1 : 0.1
          );
      }

      // Reset all styles
      function handleMouseOut() {
        svg.selectAll(".node").select("text")
          .style("opacity", 1);
        svg.selectAll(".link")
          .style("stroke-opacity", 1);
      }
    });
  </script>
</body>
</html>
