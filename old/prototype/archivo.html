<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IR Analysis Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    body {
      background-color: #2e3b2e;
      color: #e0e6db;
    }
    .sidebar {
      background-color: #4f6f52;
      height: 100vh;
    }
    .plot-container {
      height: 50vh;
    }
  </style>
</head>
<body>

<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <div class="col-2 sidebar p-3">
      <h4 class="text-white text-center">IR Analysis</h4>
      <div class="card bg-dark text-white mb-3">
        <div class="card-body">
          <h5 class="card-title">Debrief</h5>
          <p class="card-text">In this part, we try to present our results.</p>
        </div>
      </div>
      <div class="card bg-dark text-white">
        <div class="card-body">
          <h5 class="card-title">Article</h5>
          <p class="card-text">Here is the link to the article.</p>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="col-10">
      <!-- Top Row -->
      <div class="row">
        <div class="col-6">
          <!-- Tabs -->
          <ul class="nav nav-tabs" id="zoneTabs" role="tablist">
            <li class="nav-item">
              <button class="nav-link active" id="all-tab" data-bs-toggle="tab" data-bs-target="#all" type="button">All</button>
            </li>
            <li class="nav-item">
              <button class="nav-link" id="coding-tab" data-bs-toggle="tab" data-bs-target="#coding" type="button">Coding</button>
            </li>
            <li class="nav-item">
              <button class="nav-link" id="noncoding-tab" data-bs-toggle="tab" data-bs-target="#noncoding" type="button">Non Coding</button>
            </li>
          </ul>

          <!-- Plot -->
          <div class="plot-container" id="plot_i"></div>
        </div>

        <div class="col-6">
          <!-- Structural Subtabs (Static for now) -->
          <ul class="nav nav-tabs">
            <li class="nav-item"><a class="nav-link active" href="#">HA</a></li>
            <li class="nav-item"><a class="nav-link" href="#">HB</a></li>
            <li class="nav-item"><a class="nav-link" href="#">HC</a></li>
          </ul>
          <div class="d-flex">
            <div id="plot_pc1" class="plot-container w-50"></div>
            <div id="plot_pc2" class="plot-container w-50"></div>
          </div>
        </div>
      </div>

      <!-- Bottom Row -->
      <div class="row mt-4">
        <div class="col-6">
          <div id="plot_ii" class="plot-container"></div>
        </div>
        <div class="col-6">
          <!-- Replace this with actual dropdowns -->
          <select id="taxon-select" class="form-select mb-2">
            <option selected>Choose Taxon</option>
          </select>
          <select id="value-select" class="form-select">
            <option selected>Choose Value</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Your Plotly Initialization -->
<script>
  // Dummy data for demonstration
  const dummyData = {
    x: [1, 2, 3],
    y: [4, 1, 6],
    type: 'scatter',
    mode: 'markers',
    marker: { color: 'red' }
  };

  // Draw initial plots
  Plotly.newPlot('plot_i', [dummyData]);
  Plotly.newPlot('plot_pc1', [dummyData]);
  Plotly.newPlot('plot_pc2', [dummyData]);
  Plotly.newPlot('plot_ii', [dummyData]);

  // Add dropdown interactivity logic here (fetch from CSV or API as needed)
</script>

</body>
</html>
