<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IR Dashboard</title>

  <!-- Plotly -->
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

  <!-- FontAwesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <!-- DataTables CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css"
  />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <h2>IR systematic study</h2>
      <nav>
        <ul>
          <li><i class="fas fa-chart-line"></i> Introduction</li>
          <li><i class="fas fa-chart-line"></i> Strutural Analysis</li>
          <li><i class="fas fa-chart-line"></i> Kmer Analysis</li> 
        </ul>
        <div class="bottom-card">
          This card is at the bottom of the sidebar
        </div>
      </nav>
    </aside>

    <div class="main">
      <header class="header">
        <h1>Structural Analysis</h1>
      </header>

      <section class="card-grid">
        <!-- First card with tabs and plots -->
        <div class="card">
          <div class="tabs">
            <button class="tab-button active" data-tab="tab1_left">All</button>
            <button class="tab-button" data-tab="tab2_left">Coding</button>
            <button class="tab-button" data-tab="tab3_left">Non Coding</button>
          </div>
          <div class="tab-content active" id="tab1_left">
            <div id="plot1_all" style="width:100%;height:250px;"></div>
          </div>
          <div class="tab-content" id="tab2_left">
            <div id="plot1_coding" style="width:100%;height:250px;"></div>
          </div>
          <div class="tab-content" id="tab3_left">
            <div id="plot1_noncoding" style="width:100%;height:250px;"></div>
          </div>
        </div>

        <!-- Second card with tabs and plots -->
        <div class="card">
          <div class="tabs">
            <button class="tab-button active" data-tab="tab1_right">HA</button>
            <button class="tab-button" data-tab="tab2_right">HB</button>
            <button class="tab-button" data-tab="tab3_right">HC</button>
          </div>
          <div class="tab-content active" id="tab1_right">
            <div id="plot2_ha" style="width:100%;height:250px;"></div>
          </div>
          <div class="tab-content" id="tab2_right">
            <div id="plot2_hb" style="width:100%;height:250px;"></div>
          </div>
          <div class="tab-content" id="tab3_right">
            <div id="plot2_hc" style="width:100%;height:250px;"></div>
          </div>
        </div>

        <!-- Third card with single plot -->
        <div class="card">
          <div class="tabs">
            <button class="tab-button active" data-tab="tab_botton_1">Individual:</button>  
          </div>
          <div class="tab-content active" id="tab_botton_1">
            <div id="plot3" style="width:100%;height:250px;"></div>
          </div>  
        </div>

        <!-- Fourth card with taxonomy table -->
        <div class="card"> 
          <table id="taxonomy" class="display" style="width:100%">
            <thead>
              <tr class="filters">
                <th></th><th></th><th></th><th></th><th></th><th></th><th></th>
              </tr>
              <tr>
                <th>Kingdom</th>
                <th>Phylum</th>
                <th>Class</th>
                <th>Order</th>
                <th>Family</th>
                <th>Genus</th>
                <th>Species</th>
              </tr>
            </thead>

            <tbody>
              <!-- Filled dynamically -->
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- DataTables JS -->
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <!-- Custom JS -->
  <script src="scripts.js"></script>
</body>
</html>
