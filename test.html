<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Plotly Heatmap with Hover</title>
  <!-- Plotly -->
  <script src="https://cdn.plot.ly/plotly-3.0.1.min.js"></script>
</head>
<body>
  <div id="heatmap" style="width:700px; height:500px;"></div>

  <script>
    const zValues = [
      [0.1, 0.5, 0.9],
      [0.3, 0.0, -0.5],
      [0.8, -0.2, 0.4]
    ];

    const textVals = zValues.map(row =>
      row.map(val => val.toFixed(2))
    );

    const xLabels = ['Arm A', 'Arm B', 'Arm C'];
    const yLabels = ['Gap 1', 'Gap 2', 'Gap 3'];

    const colorScale = [
      [0.0, "blue"],
      [0.5, "white"],
      [1.0, "red"]
    ];

    Plotly.newPlot("heatmap", [{
      z: zValues,
      text: textVals,
      x: xLabels,
      y: yLabels,
      type: "heatmap",
      colorscale: colorScale,
      zmin: -1,
      zmax: 1,
      hovertemplate: "Value: %{text}<br>Gap: %{y}<br>Arm: %{x}<extra></extra>",
      colorbar: {
        tickvals: [-1, 0, 1],
        ticktext: [-1, 0, 1]
      }
    }], {
      title: {
        text: "Hover Heatmap Example",
        font: { size: 18 }
      },
      xaxis: {
        title: "Arm Length"
      },
      yaxis: {
        title: "Gap Length"
      },
      hovermode: "closest",
      template: "plotly_white"
    });
  </script>
</body>
</html>
